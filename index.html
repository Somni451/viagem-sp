<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Viagem SP 💜</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <h1> Viagem SP</h1>
  <p>Nosso rolê, nossas regras. 😎</p>
</header>

<main>

  <section id="participant-section">

    <h2>👾 Escolha seu personagem</h2>

    <div id="avatar-list">

      <button class="avatar-option" data-avatar="jess">
        <img src="jess.png" alt="Jess">
        <span>Jess</span>
      </button>

      <button class="avatar-option" data-avatar="leo">
        <img src="leo.png" alt="Leo">
        <span>Leo</span>
      </button>

      <button class="avatar-option" data-avatar="nego">
        <img src="nego.png" alt="Nego">
        <span>Nego</span>
      </button>

      <button class="avatar-option" data-avatar="beagons">
        <img src="beagons.png" alt="Beagons">
        <span>Beagons</span>
      </button>

      <button class="avatar-option" data-avatar="pat">
        <img src="pat.png" alt="Pat">
        <span>Pat</span>
      </button>

    </div>

  </section>

  <!-- FILTRO DE DIAS (Agora acima do título) -->
  <div class="days-container">
    <button class="day-btn active" data-day="all">Todos</button>
    <button class="day-btn" data-day="25">25 Set</button>
    <button class="day-btn" data-day="26">26 Set</button>
    <button class="day-btn" data-day="27">27 Set</button>
    <button class="day-btn" data-day="28">28 Set</button>
  </div>

  <h2>📍 Atrações</h2>

  <!-- CONTAINER DOS CARDS COM A CLASSE GRID -->
  <div id="attractions-list" class="cards-grid"></div>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="script.js"></script>

</body>
</html>
